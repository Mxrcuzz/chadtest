<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Aсsonix AI</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- ЭКРАН 1: Главное меню -->
    <div id="main-menu" class="screen active">
        <div class="theme-toggle" id="theme-toggle" title="Сменить тему">
            <span id="theme-icon">🌙</span>
        </div>

        <div class="menu-content">
            <div class="logo-placeholder">
                <div class="logo-circle"></div>
            </div>
            <h1 class="welcome-title">Aсsonix AI</h1>
            <p class="welcome-subtitle">Выберите модель для общения</p>

            <div class="model-buttons">
                <button class="model-btn" data-model="Luna">
                    <span class="btn-glow"></span>
                    GPT 5.6 Luna
                </button>
                <button class="model-btn" data-model="Astra">
                    <span class="btn-glow"></span>
                    GPT 6 ASTRA
                </button>
                <button class="model-btn" data-model="Rza">
                    <span class="btn-glow"></span>
                    GPT RZA
                </button>
            </div>
        </div>
    </div>

    <!-- ЭКРАН 2: Чат -->
    <div id="chat-screen" class="screen">
        <!-- Боковое меню (сайдбар) -->
        <div id="sidebar" class="sidebar">
            <div class="sidebar-header">
                <h2>Меню</h2>
                <button id="close-sidebar" class="close-btn">&times;</button>
            </div>
            <ul class="sidebar-menu">
                <li><button id="back-to-menu" class="sidebar-link">🏠 Главное меню</button></li>
                <li><button class="sidebar-link disabled">⚙️ Настройки (скоро)</button></li>
                <li><button class="sidebar-link disabled">👤 Профиль (скоро)</button></li>
            </ul>
        </div>

        <!-- Затемнение фона при открытом меню -->
        <div id="sidebar-overlay" class="overlay"></div>

        <!-- Шапка чата -->
        <header class="chat-header">
            <button id="open-sidebar" class="menu-btn">☰</button>
            <div class="bot-info">
                <h1 id="current-model-name">GPT 5.6 Luna</h1>
                <span class="status">онлайн</span>
            </div>
            <div class="header-spacer"></div>
        </header>

        <!-- Область сообщений -->
        <main class="chat-messages" id="chat-messages">
            <div class="message bot-message">
                <div class="message-content">Привет! Я модель <span id="greeting-model">Luna</span>. Чем могу помочь?</div>
            </div>
        </main>

        <!-- Поле ввода -->
        <footer class="chat-input-area">
            <!-- Скрытый input для выбора файла -->
            <input type="file" id="file-input" accept="image/*" hidden>
            
            <button id="attach-btn" class="attach-btn" aria-label="Прикрепить фото">
                📎
            </button>
            
            <div class="input-wrapper">
                <!-- Превью выбранного фото -->
                <div id="image-preview" class="image-preview hidden">
                    <img id="preview-img" src="" alt="preview">
                    <button id="remove-preview" class="remove-preview">&times;</button>
                </div>
                <textarea id="message-input" placeholder="Введите сообщение..." rows="1"></textarea>
            </div>
            
            <button id="send-btn" aria-label="Отправить" disabled>➤</button>
        </footer>
    </div>

    <script src="app.js"></script>
</body>
</html>
